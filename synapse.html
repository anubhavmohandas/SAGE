<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SYNAPSE — Knowledge Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'SF Mono', 'Fira Code', monospace; transition: background 0.3s; }
  body.dark  { background: #0a0d14; }
  body.light { background: #eef2f8; }
  canvas { display: block; }

  #tooltip {
    position: absolute;
    border-radius: 7px;
    font-size: 11px;
    padding: 9px 14px;
    pointer-events: none;
    display: none;
    max-width: 220px;
    line-height: 1.75;
    z-index: 10;
  }
  body.dark  #tooltip { background: rgba(8,12,22,0.95); border: 1px solid rgba(100,200,255,0.25); color: #a0d4ff; }
  body.light #tooltip { background: rgba(255,255,255,0.98); border: 1px solid rgba(60,120,200,0.25); color: #1a4070; box-shadow: 0 4px 16px rgba(0,0,80,0.1); }

  #breadcrumb {
    position: absolute;
    top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 1.4px;
    white-space: nowrap; pointer-events: none;
    transition: color 0.3s;
  }
  body.dark  #breadcrumb { color: rgba(100,180,255,0.45); }
  body.light #breadcrumb { color: rgba(40,90,170,0.55); }

  /* attack path banner */
  #path-banner {
    position: absolute;
    top: 40px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 1px;
    padding: 4px 14px; border-radius: 20px;
    display: none; white-space: nowrap; pointer-events: none;
    background: rgba(255,40,40,0.15); border: 1px solid rgba(255,80,80,0.4);
    color: #ff7070;
  }

  /* keyboard hints */
  #hints {
    position: absolute;
    top: 14px; left: 14px;
    font-size: 9px; letter-spacing: 0.5px; line-height: 1.9;
    transition: color 0.3s;
  }
  body.dark  #hints { color: rgba(255,255,255,0.2); }
  body.light #hints { color: rgba(0,0,60,0.3); }

  #controls {
    position: absolute;
    bottom: 14px; right: 14px;
    display: flex; gap: 8px; align-items: center;
  }
  #controls button {
    border-radius: 5px; font-size: 10px;
    padding: 5px 13px; cursor: pointer;
    letter-spacing: 0.5px; transition: all 0.2s;
    font-family: 'SF Mono', monospace;
  }
  body.dark  #controls button { background: rgba(100,180,255,0.08); border: 1px solid rgba(100,180,255,0.22); color: rgba(120,190,255,0.75); }
  body.light #controls button { background: rgba(40,100,200,0.07); border: 1px solid rgba(40,100,200,0.22); color: rgba(30,80,160,0.8); }
  body.dark  #controls button:hover:not(:disabled) { background: rgba(100,180,255,0.18); }
  body.light #controls button:hover:not(:disabled) { background: rgba(40,100,200,0.15); }
  #controls button:disabled { opacity: 0.22; cursor: default; }
  #theme-toggle { width:32px; height:32px; border-radius:50%!important; padding:0!important; font-size:15px!important; display:flex; align-items:center; justify-content:center; }

  #legend {
    position: absolute; bottom: 14px; left: 14px;
    font-size: 9px; line-height: 2; letter-spacing: 0.5px; transition: color 0.3s;
  }
  body.dark  #legend { color: rgba(255,255,255,0.3); }
  body.light #legend { color: rgba(0,0,60,0.4); }
  .leg { display:flex; align-items:center; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  /* zoom indicator */
  #zoom-label {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: 1px; opacity: 0;
    transition: opacity 0.4s;
  }
  body.dark  #zoom-label { color: rgba(100,180,255,0.5); }
  body.light #zoom-label { color: rgba(40,100,200,0.5); }

  /* attack path panel */
  #attack-panel {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 320px; overflow-y: auto;
    padding: 18px 16px 80px;
    font-size: 10px; line-height: 1.7;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 20;
    display: flex; flex-direction: column; gap: 14px;
  }
  #attack-panel.open { transform: translateX(0); }
  body.dark  #attack-panel { background: rgba(8,12,22,0.96); border-left: 1px solid rgba(255,80,80,0.2); color: #c0c8e0; }
  body.light #attack-panel { background: rgba(255,255,255,0.97); border-left: 1px solid rgba(200,60,60,0.2); color: #2a3050; box-shadow: -4px 0 20px rgba(0,0,60,0.08); }
  #attack-panel h2 { font-size: 10px; letter-spacing: 1.5px; margin-bottom: 2px; color: #ff6060; }
  #attack-panel .ap-close { position: absolute; top: 14px; right: 14px; cursor: pointer; font-size: 14px; opacity: 0.5; }
  #attack-panel .ap-close:hover { opacity: 1; }
  .ap-cve { border-radius: 7px; padding: 10px 12px; cursor: pointer; transition: background 0.15s; }
  body.dark  .ap-cve { background: rgba(255,80,80,0.06); border: 1px solid rgba(255,80,80,0.15); }
  body.light .ap-cve { background: rgba(255,80,80,0.04); border: 1px solid rgba(200,60,60,0.15); }
  .ap-cve:hover, .ap-cve.active { background: rgba(255,80,80,0.14) !important; border-color: rgba(255,80,80,0.4) !important; }
  .ap-cve-title { font-weight: bold; letter-spacing: 0.5px; }
  .ap-sev { font-size: 9px; letter-spacing: 1px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
  .sev-CRITICAL { background: rgba(255,34,34,0.25); color: #ff4444; }
  .sev-HIGH     { background: rgba(255,102,68,0.2); color: #ff8844; }
  .sev-MEDIUM   { background: rgba(255,170,68,0.2); color: #ffaa44; }
  .sev-LOW      { background: rgba(100,200,100,0.15); color: #88cc88; }
  .ap-path { margin-top: 6px; font-size: 9px; opacity: 0.75; padding: 4px 8px; border-radius: 4px; font-family: 'SF Mono', monospace; }
  body.dark  .ap-path { background: rgba(255,255,255,0.04); }
  body.light .ap-path { background: rgba(0,0,60,0.04); }
  .ap-entry-type { font-size: 8px; letter-spacing: 0.8px; opacity: 0.55; margin-bottom: 2px; }
  .ap-empty { opacity: 0.4; font-style: italic; text-align: center; padding: 40px 0; }
  #btn-attack-paths { background: rgba(255,80,80,0.1) !important; border-color: rgba(255,80,80,0.35) !important; color: #ff7070 !important; }
  #btn-attack-paths:hover { background: rgba(255,80,80,0.22) !important; }
  #btn-attack-paths.active { background: rgba(255,80,80,0.25) !important; border-color: rgba(255,80,80,0.6) !important; color: #ff4040 !important; }
</style>
</head>
<body class="dark">
<canvas id="c"></canvas>
<div id="tooltip"></div>

<div id="attack-panel">
  <span class="ap-close" id="ap-close">✕</span>
  <h2>⚠ ATTACK PATHS</h2>
  <div id="ap-content"><div class="ap-empty">No reachable attack paths found.</div></div>
</div>
<div id="breadcrumb">SYNAPSE · KNOWLEDGE GRAPH</div>
<div id="path-banner"></div>

<div id="hints">
  ESC / ← &nbsp;Back<br>
  R &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Reset<br>
  S &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Save PNG<br>
  scroll &nbsp;Zoom
</div>

<div id="controls">
  <button id="back" disabled>← BACK</button>
  <button id="reset">RESET</button>
  <button id="btn-attack-paths">⚠ ATTACK PATHS</button>
  <button id="export">SAVE PNG</button>
  <button id="theme-toggle" title="Toggle theme">☀️</button>
</div>

<div id="legend">
  <div class="leg"><div class="dot" style="background:#5bc8ff"></div> FILE</div>
  <div class="leg"><div class="dot" style="background:#4db87a"></div> FUNCTION</div>
  <div class="leg"><div class="dot" style="background:#e8960a"></div> LIBRARY</div>
  <div class="leg"><div class="dot" style="background:#ff4444"></div> CVE</div>
  <div class="leg"><div class="dot" style="background:#a78bfa"></div> REPO</div>
</div>
<div id="zoom-label">100%</div>

<script>
// ─── THEME ───────────────────────────────────────────────────────────────────
let isDark = true;
const themeBtn = document.getElementById('theme-toggle');
themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  document.body.className = isDark ? 'dark' : 'light';
  themeBtn.textContent = isDark ? '☀️' : '🌙';
});

// ─── CANVAS + CONTEXT ────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const tooltip    = document.getElementById('tooltip');
const pathBanner = document.getElementById('path-banner');
const zoomLabel  = document.getElementById('zoom-label');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); layout(); });

// ─── DATA ────────────────────────────────────────────────────────────────────
const GRAPH = {
  nodes: {
    root:           { id:'root',           label:'auth.py',          type:'file',     color:'#5bc8ff', glowD:'rgba(91,200,255,0.5)',  glowL:'rgba(30,120,220,0.28)',  info:'Entry: auth module',                        children:['login_user','validate_token','db','requests'] },
    login_user:     { id:'login_user',     label:'login_user()',      type:'function', color:'#4db87a', glowD:'rgba(77,184,122,0.45)', glowL:'rgba(30,140,80,0.28)',   info:'Handles user login flow',                   children:['requests','sql_query'] },
    validate_token: { id:'validate_token', label:'validate_token()',  type:'function', color:'#4db87a', glowD:'rgba(77,184,122,0.45)', glowL:'rgba(30,140,80,0.28)',   info:'JWT validation logic',                      children:['jwt_lib'] },
    db:             { id:'db',             label:'db.py',             type:'file',     color:'#5bc8ff', glowD:'rgba(91,200,255,0.5)',  glowL:'rgba(30,120,220,0.28)',  info:'Database connector',                        children:['sql_query'] },
    requests:       { id:'requests',       label:'requests',          type:'library',  color:'#e8960a', glowD:'rgba(232,150,10,0.45)', glowL:'rgba(180,100,0,0.28)',   info:'v2.28.0 — HTTP client',                    children:['urllib3','certifi'] },
    sql_query:      { id:'sql_query',      label:'sql_query()',       type:'function', color:'#4db87a', glowD:'rgba(77,184,122,0.45)', glowL:'rgba(30,140,80,0.28)',   info:'Raw SQL execution — risky',                 children:['cve_sqli'] },
    jwt_lib:        { id:'jwt_lib',        label:'PyJWT',             type:'library',  color:'#e8960a', glowD:'rgba(232,150,10,0.45)', glowL:'rgba(180,100,0,0.28)',   info:'v2.4.0 — JWT library',                     children:[] },
    urllib3:        { id:'urllib3',        label:'urllib3',           type:'library',  color:'#e8960a', glowD:'rgba(232,150,10,0.45)', glowL:'rgba(180,100,0,0.28)',   info:'v1.26.5 — HTTP core',                      children:['cve_urllib3'] },
    certifi:        { id:'certifi',        label:'certifi',           type:'library',  color:'#e8960a', glowD:'rgba(232,150,10,0.45)', glowL:'rgba(180,100,0,0.28)',   info:'CA bundle — no CVE',                       children:[] },
    cve_sqli:       { id:'cve_sqli',       label:'CVE-2023-1671',     type:'cve',      color:'#ff4444', glowD:'rgba(255,68,68,0.6)',   glowL:'rgba(200,0,0,0.3)',      info:'SQL Injection\nSeverity: CRITICAL\nCWE-89', children:[] },
    cve_urllib3:    { id:'cve_urllib3',    label:'CVE-2021-33503',    type:'cve',      color:'#ff4444', glowD:'rgba(255,68,68,0.6)',   glowL:'rgba(200,0,0,0.3)',      info:'ReDoS via urllib3\nSeverity: HIGH\nCWE-400', children:[] },
  },
  edges: [
    ['root','login_user',     'CALLS'],
    ['root','validate_token', 'CALLS'],
    ['root','db',             'IMPORTS'],
    ['root','requests',       'IMPORTS'],
    ['login_user','requests', 'USES'],
    ['login_user','sql_query','CALLS'],
    ['validate_token','jwt_lib','USES'],
    ['db','sql_query',        'CALLS'],
    ['requests','urllib3',    'DEPENDS_ON'],
    ['requests','certifi',    'DEPENDS_ON'],
    ['sql_query','cve_sqli',  'AFFECTS'],
    ['urllib3','cve_urllib3', 'AFFECTS'],
  ]
};

// Build adjacency for path tracing
const adjReverse = {}; // child → [parents]
Object.keys(GRAPH.nodes).forEach(id => adjReverse[id] = []);
GRAPH.edges.forEach(([a, b]) => adjReverse[b].push(a));

// Precompute connection counts
const connCount = {};
Object.keys(GRAPH.nodes).forEach(id => connCount[id] = 0);
GRAPH.edges.forEach(([a,b]) => { connCount[a]++; connCount[b]++; });

const CVE_SEV_RADIUS = { CRITICAL: 26, HIGH: 20, MEDIUM: 16, LOW: 13 };
const CVE_SEV_COLOR  = { CRITICAL: '#ff2222', HIGH: '#ff6644', MEDIUM: '#ffaa44', LOW: '#ffcc44' };

function cveColor(node) {
  // Extract severity from info field ("CRITICAL severity..." or "HIGH severity...")
  if (!node || node.type !== 'cve') return '#ff4444';
  const sev = (node.info || '').split(' ')[0].toUpperCase();
  return CVE_SEV_COLOR[sev] || '#ff4444';
}

function nodeRadius(id) {
  const node = GRAPH.nodes[id];
  if (node && node.type === 'repo') return 32;
  if (node && node.type === 'cve') {
    const sev = (node.info || '').split(' ')[0].toUpperCase();
    return CVE_SEV_RADIUS[sev] || 16;
  }
  return 18 + Math.min((connCount[id] || 0) * 2, 12);
}

const TYPE_ICON = { file:'{ }', function:'()', library:'⬡', cve:'⚠', repo:'⬢' };

// ─── ATTACK PATH TRACING ─────────────────────────────────────────────────────
// BFS from a CVE back to root — returns Set of node IDs and edge pairs on the path
function traceAttackPath(cveId) {
  const visited = new Set();
  const pathEdges = new Set();
  const queue = [cveId];
  const parent = { [cveId]: null };

  while (queue.length) {
    const cur = queue.shift();
    if (visited.has(cur)) continue;
    visited.add(cur);
    adjReverse[cur].forEach(p => {
      if (!visited.has(p)) {
        parent[p] = cur;
        pathEdges.add(`${p}→${cur}`);
        queue.push(p);
      }
    });
  }
  return { pathNodes: visited, pathEdges };
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let centerNodeId = 'root';
let history      = [];
let positions    = {};
let pulses       = [];
let hoveredNode  = null;
let attackPath   = null; // { pathNodes, pathEdges } or null
let hoveredEdge  = null; // { a, b, label, mx, my }

// zoom/pan
let zoom = 1, panX = 0, panY = 0;
let zoomTimeout;

// tween
let tween = null; // { from:{}, to:{}, t, duration }

// Type visibility rules per center node type
const VISIBLE_TYPES = {
  // repo root: show all files — this is the entry point into the codebase
  repo:     ['file'],
  // file drill-down: show functions defined in it + libraries it imports
  file:     ['function', 'library'],
  // library: show CVEs affecting it + files that import it
  library:  ['cve', 'file'],
  // function: show libraries it calls + CVEs on those libs
  function: ['library', 'cve'],
  cve:      ['library', 'file'],
  unknown:  ['library', 'cve', 'file'],
};

// Max neighbours to show per level
const MAX_NEIGHBOURS = 30;

function getConnectedIds(nodeId) {
  const node       = GRAPH.nodes[nodeId];
  const centerType = node ? node.type : 'unknown';
  const allowed    = VISIBLE_TYPES[centerType] || VISIBLE_TYPES['unknown'];

  const ids = new Set([nodeId]);
  GRAPH.edges.forEach(([a, b]) => {
    const otherA = GRAPH.nodes[a], otherB = GRAPH.nodes[b];
    if (a === nodeId && otherB && allowed.includes(otherB.type)) ids.add(b);
    if (b === nodeId && otherA && allowed.includes(otherA.type)) ids.add(a);
  });

  // For file and function nodes: pull CVEs through their library neighbours (2-hop)
  // So you can see: file → lib (orange) AND the CVE badge on that lib — without needing to click lib
  if (centerType === 'file' || centerType === 'function') {
    ids.forEach(libId => {
      if (GRAPH.nodes[libId]?.type === 'library') {
        GRAPH.edges.forEach(([a, b]) => {
          if (a === libId && GRAPH.nodes[b]?.type === 'cve') ids.add(b);
        });
      }
    });
  }

  // Cap and prioritise: CVEs first, then libraries, then files, then functions
  const neighbours = [...ids].filter(id => id !== nodeId);
  if (neighbours.length > MAX_NEIGHBOURS) {
    const priority = id => {
      const t = GRAPH.nodes[id]?.type;
      return t==='cve' ? 0 : t==='library' ? 1 : t==='file' ? 2 : 3;
    };
    neighbours.sort((a, b) => priority(a) - priority(b));
    return [nodeId, ...neighbours.slice(0, MAX_NEIGHBOURS)];
  }
  return [...ids];
}

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
function layout(animate = false) {
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const visibleIds  = getConnectedIds(centerNodeId);
  const neighbours  = visibleIds.filter(id => id !== centerNodeId);
  const n = neighbours.length;
  // Scale ring radius so nodes never crowd — guarantee min arc gap of 54px between nodes
  const baseR = Math.min(W, H) * 0.34;
  const minRForGap = n > 1 ? (54 * n) / (2 * Math.PI) : baseR;
  const R = Math.max(baseR, Math.min(minRForGap, Math.min(W, H) * 0.48));

  const newPositions = {};
  newPositions[centerNodeId] = { x: cx, y: cy };
  neighbours.forEach((id, i) => {
    const angle = (i/n)*Math.PI*2 - Math.PI/2;
    newPositions[id] = { x: cx + Math.cos(angle)*R, y: cy + Math.sin(angle)*R };
  });

  if (animate && Object.keys(positions).length) {
    // Build tween from current → new
    const from = {}, to = {};
    Object.keys(newPositions).forEach(id => {
      from[id] = positions[id] ? { ...positions[id] } : { x: cx, y: cy };
      to[id]   = newPositions[id];
    });
    // ← KEY FIX: immediately drop ghost nodes from positions
    // Only keep ids that belong to the new view; old ids are gone.
    positions = { ...from };
    tween = { from, to, t: 0, duration: 420 };
  } else {
    positions = newPositions;
    tween = null;
  }

  pulses = [];
  GRAPH.edges.forEach(([a,b]) => {
    const pa = newPositions[a], pb = newPositions[b];
    if (pa && pb) pulses.push({ a, b, t: Math.random(), speed: 0.004 + Math.random()*0.003 });
  });
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

function lerp(a, b, t) { return a + (b-a)*t; }

function bezierCP(pa, pb) {
  const mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2;
  const dx=pb.x-pa.x, dy=pb.y-pa.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1, bend=len*0.10;
  return { x: mx-(dy/len)*bend, y: my+(dx/len)*bend };
}

function bezierPoint(pa, cp, pb, t) {
  return {
    x: (1-t)*(1-t)*pa.x + 2*(1-t)*t*cp.x + t*t*pb.x,
    y: (1-t)*(1-t)*pa.y + 2*(1-t)*t*cp.y + t*t*pb.y,
  };
}

function worldToScreen(x, y) {
  return { x: x*zoom + panX, y: y*zoom + panY };
}

function screenToWorld(sx, sy) {
  return { x: (sx - panX)/zoom, y: (sy - panY)/zoom };
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function drawGrid() {
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.028)' : 'rgba(0,0,100,0.045)';
  ctx.lineWidth = 0.5;
  const step = 44 * zoom;
  const offX = panX % step, offY = panY % step;
  for (let x=offX; x<canvas.width;  x+=step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for (let y=offY; y<canvas.height; y+=step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y);  ctx.stroke(); }
}

function drawEdge(a, b, edgeLabel) {
  const rawA = positions[a], rawB = positions[b];
  if (!rawA||!rawB) return;

  const pa = worldToScreen(rawA.x, rawA.y);
  const pb = worldToScreen(rawB.x, rawB.y);
  const cp = bezierCP(pa, pb);

  const edgeKey = `${a}→${b}`;
  const onPath  = attackPath && attackPath.pathEdges.has(edgeKey);
  const isHE    = hoveredEdge && hoveredEdge.a===a && hoveredEdge.b===b;

  let strokeColor, lw;
  if (onPath) {
    strokeColor = `rgba(255,80,80,${isDark?'0.75':'0.65'})`;
    lw = 2.5;
  } else if (isHE) {
    strokeColor = isDark ? 'rgba(140,200,255,0.6)' : 'rgba(40,100,200,0.55)';
    lw = 2;
  } else {
    strokeColor = isDark ? 'rgba(100,160,220,0.2)' : 'rgba(40,100,200,0.15)';
    lw = 1.5;
  }

  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.quadraticCurveTo(cp.x, cp.y, pb.x, pb.y);
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = lw;
  ctx.stroke();

  // Arrow
  const angle = Math.atan2(pb.y - cp.y, pb.x - cp.x);
  const r = nodeRadius(b)*zoom;
  const ax = pb.x - Math.cos(angle)*r, ay = pb.y - Math.sin(angle)*r;
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax-Math.cos(angle-0.38)*9, ay-Math.sin(angle-0.38)*9);
  ctx.lineTo(ax-Math.cos(angle+0.38)*9, ay-Math.sin(angle+0.38)*9);
  ctx.closePath();
  ctx.fillStyle = onPath
    ? 'rgba(255,100,100,0.7)'
    : (isDark ? 'rgba(100,170,240,0.38)' : 'rgba(40,100,200,0.32)');
  ctx.fill();

  // Edge label on hover
  if (isHE && edgeLabel) {
    const mid = bezierPoint(pa, cp, pb, 0.5);
    ctx.font = '9px SF Mono, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(edgeLabel).width;
    ctx.fillStyle = isDark ? 'rgba(8,12,22,0.85)' : 'rgba(240,245,255,0.92)';
    ctx.fillRect(mid.x - tw/2 - 5, mid.y - 9, tw+10, 17);
    ctx.fillStyle = isDark ? 'rgba(180,220,255,0.9)' : 'rgba(30,80,160,0.9)';
    ctx.fillText(edgeLabel, mid.x, mid.y);
  }
}

function drawPulse(p) {
  const rawA = positions[p.a], rawB = positions[p.b];
  if (!rawA||!rawB) return;
  const pa = worldToScreen(rawA.x, rawA.y);
  const pb = worldToScreen(rawB.x, rawB.y);
  const cp = bezierCP(pa, pb);
  const pt = bezierPoint(pa, cp, pb, p.t);

  const onPath = attackPath && attackPath.pathEdges.has(`${p.a}→${p.b}`);
  const node   = GRAPH.nodes[p.a];
  ctx.beginPath();
  ctx.arc(pt.x, pt.y, onPath ? 4.5 : 3, 0, Math.PI*2);
  ctx.fillStyle = onPath ? '#ff6060' : node.color;
  ctx.globalAlpha = 0.9 - Math.abs(p.t-0.5)*1.6;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawNode(id) {
  const rawPos = positions[id];
  if (!rawPos) return;
  const pos  = worldToScreen(rawPos.x, rawPos.y);
  const node = GRAPH.nodes[id];
  const isCenter  = id === centerNodeId;
  const isHovered = id === hoveredNode;
  const onPath    = attackPath && attackPath.pathNodes.has(id);
  const r = nodeRadius(id) * (isCenter ? 1.3 : 1) * zoom;
  // Override color for CVEs based on severity
  const nodeColor = node.type === 'cve' ? cveColor(node) : node.color;
  const glowAlpha = node.type === 'cve' ? '88' : '77';
  const glow = isDark
    ? nodeColor + glowAlpha
    : nodeColor + (node.type === 'cve' ? '55' : '44');

  // Attack path outer pulse ring
  if (onPath) {
    const now = Date.now();
    const pulse = 0.55 + 0.45*Math.sin(now*0.003 + id.length*0.7);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, r + 10*pulse, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,60,60,${0.35*pulse})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Glow
  if (isCenter || isHovered || onPath) {
    const glowColor = onPath ? 'rgba(255,60,60,0.5)' : glow;
    const gr = ctx.createRadialGradient(pos.x, pos.y, r*0.2, pos.x, pos.y, r*2.8);
    gr.addColorStop(0, glowColor);
    gr.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, r*2.8, 0, Math.PI*2);
    ctx.fillStyle = gr;
    ctx.fill();
  }

  // Center ring
  if (isCenter) {
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, r+7, 0, Math.PI*2);
    ctx.strokeStyle = nodeColor + '38';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Node fill
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, r, 0, Math.PI*2);
  const bg = ctx.createRadialGradient(pos.x-r*0.28, pos.y-r*0.28, 0, pos.x, pos.y, r);
  const fillAlpha = isDark ? (onPath ? 'ff' : 'cc') : (onPath ? 'ff' : 'dd');
  bg.addColorStop(0, (onPath?'#ff6060':nodeColor) + fillAlpha);
  bg.addColorStop(1, (onPath?'#aa0000':nodeColor) + '55');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = (isHovered||onPath) ? (onPath?'#ff8080':nodeColor) : nodeColor + '77';
  ctx.lineWidth = (isHovered||onPath) ? 2.5 : 1.5;
  ctx.stroke();

  // Icon
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = isDark ? 'rgba(255,255,255,0.92)' : '#fff';
  ctx.font = `bold ${Math.max(8, r*0.42)}px monospace`;
  ctx.fillText(TYPE_ICON[node.type]||'?', pos.x, pos.y);

  // ── Smart label strategy ────────────────────────────────────────────────────
  // Arc gap is computed in SCREEN pixels (zoom-aware) so the threshold is meaningful.
  // Layout:
  //   arcGap >= 110px  → all labels, full text, type tag shown
  //   arcGap  60-110px → all labels, truncated to fit arc gap, no type tag
  //   arcGap <  60px   → CVE/library always; file/fn on hover/path only
  //                       stagger alternate nodes onto inner/outer label ring

  const visNeighbours = Object.keys(positions).length - 1;
  // Ring radius in SCREEN pixels (multiply world radius by zoom)
  const worldRingR = Math.max(
    Math.min(canvas.width, canvas.height) / zoom * 0.34,
    visNeighbours > 1 ? (54 * visNeighbours) / (2 * Math.PI) : 0
  );
  const screenRingR = worldRingR * zoom;
  const arcGap = visNeighbours > 0 ? (2 * Math.PI * screenRingR) / visNeighbours : 999;

  const FULL_THRESHOLD   = 110; // show everything
  const TRUNC_THRESHOLD  = 60;  // show truncated labels for all
  // Below TRUNC_THRESHOLD: signal nodes always, others hover-only + stagger

  const isSignal  = node.type === 'cve' || node.type === 'library';
  const showLabel = isCenter || onPath || isHovered || isSignal || arcGap >= TRUNC_THRESHOLD;
  if (!showLabel) return;

  // Anchor angle — radially outward from center
  const angle = isCenter
    ? -Math.PI/2
    : Math.atan2(rawPos.y - canvas.height / 2, rawPos.x - canvas.width / 2);

  // Stagger: when crowded, alternate even/odd nodes between inner and outer label rings
  // so adjacent labels are offset vertically and stop colliding
  const nodeIndex   = Object.keys(positions).indexOf(id);
  const stagger     = (arcGap < TRUNC_THRESHOLD && !isCenter && !isSignal)
    ? (nodeIndex % 2 === 0 ? -14 : 14)
    : 0;
  const ldist = r + (isCenter ? 56 : 34) + stagger;
  const lx = pos.x + Math.cos(angle) * ldist;
  const ly = pos.y + Math.sin(angle) * ldist;

  // Align outward so label never crosses back over the node
  const absAngleDeg = ((angle * 180 / Math.PI) % 360 + 360) % 360;
  if (!isCenter) {
    if      (absAngleDeg > 280 || absAngleDeg < 80)  ctx.textAlign = 'left';
    else if (absAngleDeg > 100 && absAngleDeg < 260) ctx.textAlign = 'right';
    else                                              ctx.textAlign = 'center';
  } else {
    ctx.textAlign = 'center';
  }
  ctx.textBaseline = 'middle';

  // Font size — shrink slightly when crowded
  const fs = isCenter ? 12 : (arcGap >= FULL_THRESHOLD ? 10 : 9);
  ctx.font = `${fs}px SF Mono, monospace`;

  // Truncate label to fit available arc gap when crowded
  // Max chars ≈ arcGap / ~7px per char (at 9-10px font)
  const charPx    = fs * 0.65;
  const maxChars  = arcGap >= FULL_THRESHOLD ? 999 : Math.max(6, Math.floor(arcGap / charPx));
  const rawLabel  = node.label || '';
  const label     = (isHovered || onPath || arcGap >= FULL_THRESHOLD || rawLabel.length <= maxChars)
    ? rawLabel
    : rawLabel.slice(0, maxChars - 1) + '…';

  ctx.fillStyle = onPath
    ? '#ff8888'
    : isCenter   ? nodeColor
    : isHovered  ? (isDark ? '#fff' : '#000')
    : node.type === 'cve'     ? (isDark ? 'rgba(255,140,140,0.92)' : 'rgba(180,0,0,0.85)')
    : node.type === 'library' ? (isDark ? 'rgba(255,190,80,0.92)'  : 'rgba(160,90,0,0.85)')
    : (isDark ? 'rgba(255,255,255,0.75)' : 'rgba(0,0,60,0.70)');
  ctx.fillText(label, lx, ly);

  // Type tag — only when there's room or node is signal/hovered/path
  const showTypeTag = arcGap >= FULL_THRESHOLD || isCenter || isHovered || onPath || isSignal;
  if (showTypeTag) {
    ctx.font = '8px monospace';
    ctx.fillStyle = (onPath ? '#ff6060' : nodeColor) + (isDark ? '99' : 'bb');
    ctx.fillText(node.type.toUpperCase(), lx, ly + 13);
  }
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastTime = 0;
function draw(ts) {
  const dt = ts - lastTime; lastTime = ts;

  // Tween positions
  if (tween) {
    tween.t += dt / tween.duration;
    if (tween.t >= 1) { tween.t = 1; }
    const e = easeInOut(tween.t);
    Object.keys(tween.to).forEach(id => {
      positions[id] = {
        x: lerp(tween.from[id].x, tween.to[id].x, e),
        y: lerp(tween.from[id].y, tween.to[id].y, e),
      };
    });
    if (tween.t >= 1) tween = null;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();

  // Edges
  GRAPH.edges.forEach(([a,b,lbl]) => {
    if (positions[a] && positions[b]) drawEdge(a, b, lbl);
  });

  // Pulses
  pulses.forEach(p => {
    p.t += p.speed;
    if (p.t >= 1) p.t = 0;
    drawPulse(p);
  });

  // Nodes
  Object.keys(positions).forEach(id => drawNode(id));

  requestAnimationFrame(draw);
}

// ─── EDGE HOVER DETECTION ────────────────────────────────────────────────────
function edgeDistSq(mx, my, a, b) {
  const rawA = positions[a], rawB = positions[b];
  if (!rawA||!rawB) return Infinity;
  const pa = worldToScreen(rawA.x, rawA.y);
  const pb = worldToScreen(rawB.x, rawB.y);
  const cp = bezierCP(pa, pb);
  let minD = Infinity;
  for (let t=0; t<=1; t+=0.04) {
    const pt = bezierPoint(pa, cp, pb, t);
    const dx=mx-pt.x, dy=my-pt.y;
    minD = Math.min(minD, dx*dx+dy*dy);
  }
  return minD;
}

// ─── NODE HIT TEST ────────────────────────────────────────────────────────────
function getNodeAt(sx, sy) {
  for (const [id, rawPos] of Object.entries(positions)) {
    const pos = worldToScreen(rawPos.x, rawPos.y);
    const dx=sx-pos.x, dy=sy-pos.y;
    const r = nodeRadius(id)*(id===centerNodeId?1.3:1)*zoom + 5;
    if (dx*dx+dy*dy <= r*r) return id;
  }
  return null;
}

// ─── INTERACTION ──────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const sx=e.clientX, sy=e.clientY;
  const id = getNodeAt(sx, sy);
  hoveredNode = id;
  canvas.style.cursor = id ? 'pointer' : 'default';

  // Edge hover (only if not on a node)
  hoveredEdge = null;
  if (!id) {
    let bestD = 100, bestEdge = null;
    GRAPH.edges.forEach(([a,b,lbl]) => {
      if (!positions[a]||!positions[b]) return;
      const d = Math.sqrt(edgeDistSq(sx, sy, a, b));
      if (d < bestD) { bestD=d; bestEdge={a,b,label:lbl}; }
    });
    hoveredEdge = bestEdge;
  }

  // Attack path on CVE hover — use precomputed paths if available, else BFS
  if (id && GRAPH.nodes[id].type === 'cve') {
    const cveId = id.replace('cve:', '');
    const precomp = ATTACK_PATHS.find(a => a.cve_id === cveId);
    if (precomp && precomp.paths.length) {
      // Trigger panel selection for this CVE
      _selectAttackPath(cveId);
    } else {
      // Fallback: BFS graph traversal
      attackPath = traceAttackPath(id);
      const chain = buildChainLabel(id);
      pathBanner.style.display = 'block';
      pathBanner.textContent = '⚠ ATTACK PATH (BFS): ' + chain;
    }
  } else if (!id && !precomputedAttackPath) {
    attackPath = null;
    pathBanner.style.display = 'none';
  }

  // Tooltip
  if (id) {
    const node = GRAPH.nodes[id];
    tooltip.style.display = 'block';
    tooltip.style.left = (sx+16) + 'px';
    tooltip.style.top  = (sy-12) + 'px';
    let html = `<b style="color:${node.color}">${node.label}</b><br>${node.info.replace(/\n/g,'<br>')}`;
    const links = connCount[id];
    if (links) html += `<br><span style="opacity:.55">→ ${links} connection${links>1?'s':''}</span>`;
    if (id!==centerNodeId && node.children.length>0) html += `<br><span style="opacity:.35;font-size:9px">click to drill in</span>`;
    if (node.type==='cve') html += `<br><span style="color:#ff8080;font-size:9px">hover to trace attack path</span>`;
    tooltip.innerHTML = html;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode=null; hoveredEdge=null; attackPath=null;
  pathBanner.style.display='none';
  tooltip.style.display='none';
});

// Build readable chain string root → ... → CVE
function buildChainLabel(cveId) {
  const parent = {};
  const visited = new Set();
  const queue = [cveId];
  parent[cveId] = null;
  while (queue.length) {
    const cur = queue.shift();
    if (visited.has(cur)) continue;
    visited.add(cur);
    adjReverse[cur].forEach(p => { if (!parent.hasOwnProperty(p)) { parent[p]=cur; queue.push(p); } });
  }
  // Find path from root to cve
  const rootId = 'root';
  if (!visited.has(rootId)) return cveId;
  const path = [];
  let cur = rootId;
  const seen = new Set();
  while (cur && !seen.has(cur)) {
    path.push(GRAPH.nodes[cur].label);
    seen.add(cur);
    cur = parent[cur];
  }
  return path.join(' → ');
}

canvas.addEventListener('click', e => {
  const id = getNodeAt(e.clientX, e.clientY);
  if (id && id!==centerNodeId && GRAPH.nodes[id].children.length>0) {
    history.push(centerNodeId);
    centerNodeId = id;
    setBreadcrumb(id);
    updateBackBtn();
    layout(true); // animated
  }
});

// ─── ZOOM ────────────────────────────────────────────────────────────────────
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  const wx = e.clientX, wy = e.clientY;
  const before = screenToWorld(wx, wy);
  zoom = Math.max(0.3, Math.min(3.5, zoom * factor));
  const after = screenToWorld(wx, wy);
  panX += (after.x - before.x) * zoom;
  panY += (after.y - before.y) * zoom;

  // Show zoom %
  zoomLabel.textContent = Math.round(zoom*100) + '%';
  zoomLabel.style.opacity = '1';
  clearTimeout(zoomTimeout);
  zoomTimeout = setTimeout(() => { zoomLabel.style.opacity='0'; }, 1200);
}, { passive: false });

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Escape'||e.key==='ArrowLeft') goBack();
  if (e.key==='r'||e.key==='R') doReset();
  if (e.key==='s'||e.key==='S') exportPNG();
});

// ─── CONTROLS ────────────────────────────────────────────────────────────────
function updateBackBtn() { document.getElementById('back').disabled = history.length===0; }
function setBreadcrumb(id) {
  const label = id==='root' ? 'KNOWLEDGE GRAPH' : GRAPH.nodes[id].label.toUpperCase();
  document.getElementById('breadcrumb').textContent = `SYNAPSE · ${label}`;
}
function goBack() {
  if (!history.length) return;
  centerNodeId = history.pop();
  setBreadcrumb(centerNodeId);
  updateBackBtn();
  layout(true);
}
const _defaultRoot = GRAPH.nodes['root'] ? 'root' : Object.keys(GRAPH.nodes)[0] || 'root';
function doReset() {
  const resetTarget = GRAPH.nodes['repo:root'] ? 'repo:root' : _defaultRoot;
  history=[]; centerNodeId=resetTarget;
  setBreadcrumb(resetTarget); updateBackBtn();
  zoom=1; panX=0; panY=0;
  layout(true);
}
function exportPNG() {
  const link = document.createElement('a');
  link.download = 'synapse_graph.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.getElementById('back').addEventListener('click', goBack);
document.getElementById('reset').addEventListener('click', doReset);
document.getElementById('export').addEventListener('click', exportPNG);

// ─── LOAD GRAPH FROM JSON ────────────────────────────────────────────────────
// NOTE: loadGraphData is called programmatically by the export pipeline.
// The manual LOAD GRAPH button has been removed — always open demos/<repo>_<date>/index.html instead.
function loadGraphData(data) {
  // Clear existing graph
  GRAPH.nodes = {};
  GRAPH.edges = [];

  // Load nodes
  (data.nodes || []).forEach(n => {
    GRAPH.nodes[n.id] = {
      id:       n.id,
      label:    n.label || n.id,
      type:     n.type  || 'unknown',
      color:    n.color || TYPE_COLORS[n.type] || '#888',
      glowD:    (n.color || '#888') + '77',
      glowL:    (n.color || '#888') + '44',
      info:     n.info  || '',
      children: n.children || [],
    };
  });

  // Load edges (node_link_data uses 'links' or 'edges')
  const edgeList = data.links || data.edges || [];
  edgeList.forEach(e => {
    GRAPH.edges.push([e.source, e.target, e.label || '']);
  });

  // Rebuild adjacency
  Object.keys(GRAPH.nodes).forEach(id => adjReverse[id] = []);
  GRAPH.edges.forEach(([a, b]) => {
    if (!adjReverse[b]) adjReverse[b] = [];
    adjReverse[b].push(a);
  });

  // Rebuild connection counts (critical — nodeRadius breaks with stale counts)
  Object.keys(GRAPH.nodes).forEach(id => connCount[id] = 0);
  GRAPH.edges.forEach(([a, b]) => { connCount[a] = (connCount[a]||0)+1; connCount[b] = (connCount[b]||0)+1; });

  // Root picker — prefer repo:root (repo-first view), fall back to most-CVE library
  if (GRAPH.nodes['repo:root']) {
    centerNodeId = 'repo:root';
  } else {
    const SEV_SCORE = { CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1 };
    const libsWithCves = Object.keys(GRAPH.nodes).filter(id => GRAPH.nodes[id].type === 'library');
    libsWithCves.sort((a, b) => {
      const score = id => (GRAPH.nodes[id].children || []).reduce((s, cid) => {
        const sev = GRAPH.nodes[cid]?.severity || '';
        return s + (SEV_SCORE[sev] || 0) + (GRAPH.nodes[cid]?.type === 'cve' ? 1 : 0);
      }, 0);
      return score(b) - score(a);
    });
    if (libsWithCves.length > 0) {
      centerNodeId = libsWithCves[0];
    } else {
      const allFiles = Object.keys(GRAPH.nodes).filter(id => GRAPH.nodes[id].type === 'file');
      allFiles.sort((a,b) => (GRAPH.nodes[b].children||[]).length - (GRAPH.nodes[a].children||[]).length);
      centerNodeId = allFiles[0] || Object.keys(GRAPH.nodes)[0];
    }
  }
  history = [];
  attackPath = null;
  precomputedAttackPath = null;
  activeCveId = null;
  pathBanner.style.display = 'none';
  document.querySelectorAll('.ap-cve').forEach(el => el.classList.remove('active'));
  setBreadcrumb(centerNodeId);
  updateBackBtn();
  layout(false);

  const total = Object.keys(GRAPH.nodes).length;
  document.getElementById('breadcrumb').textContent =
    `SYNAPSE · LOADED · ${total} nodes`;
  console.log(`[synapse] Loaded graph: ${total} nodes, ${GRAPH.edges.length} edges`);

  // Load precomputed attack paths from reachability engine
  ATTACK_PATHS = data.attack_paths || [];
  _buildAttackPanel();
  // Update button visibility
  const apBtn = document.getElementById('btn-attack-paths');
  if (ATTACK_PATHS.length > 0) {
    apBtn.style.display = '';
    apBtn.title = `${ATTACK_PATHS.length} CVE(s) with reachable attack paths`;
  } else {
    apBtn.style.display = 'none';
  }
}

// ─── ATTACK PATH PANEL ────────────────────────────────────────────────────────
let ATTACK_PATHS = [];          // [{cve_id, severity, paths:[{entry,path,depth,entry_type}]}]
let activeCveId  = null;        // currently highlighted CVE in panel
let precomputedAttackPath = null; // {pathNodes: Set, pathEdges: Set} from panel selection

function _buildAttackPanel() {
  const content = document.getElementById('ap-content');
  if (!ATTACK_PATHS.length) {
    content.innerHTML = '<div class="ap-empty">No reachable attack paths found.</div>';
    return;
  }

  content.innerHTML = ATTACK_PATHS.map(ap => {
    const sev = ap.severity || 'UNKNOWN';
    const pathsHtml = (ap.paths || []).slice(0, 4).map(p => {
      // Render as vertical hop chain instead of flat arrow string
      const hops = p.path.map((step, i) => {
        const isLast = i === p.path.length - 1;
        return `<div style="display:flex;align-items:center;gap:5px;margin:1px 0;">
          <span style="opacity:0.4;font-size:8px;">${isLast ? '▶' : '↓'}</span>
          <span style="color:${isLast ? '#ff8080' : 'inherit'};font-weight:${isLast?'bold':'normal'}">${step}</span>
        </div>`;
      }).join('');
      const entryType = (p.entry_type || '').replace(/_/g,' ').toUpperCase();
      return `<div class="ap-path">
        <div class="ap-entry-type" style="margin-bottom:4px;">${entryType}</div>
        ${hops}
        <div style="margin-top:5px;padding:2px 6px;border-radius:3px;background:rgba(255,80,80,0.12);color:#ff8080;font-size:8px;letter-spacing:1px;display:inline-block;">
          REACHABLE &nbsp;·&nbsp; ${p.depth} hop${p.depth!==1?'s':''}
        </div>
      </div>`;
    }).join('');

    return `<div class="ap-cve" data-cve="${ap.cve_id}" onclick="_selectAttackPath('${ap.cve_id}')">
      <div class="ap-cve-title">${ap.cve_id}<span class="ap-sev sev-${sev}">${sev}</span></div>
      ${pathsHtml}
    </div>`;
  }).join('');
}

function _selectAttackPath(cveId) {
  // Toggle off if same CVE clicked again
  if (activeCveId === cveId) {
    activeCveId = null;
    precomputedAttackPath = null;
    attackPath = null;
    pathBanner.style.display = 'none';
    document.querySelectorAll('.ap-cve').forEach(el => el.classList.remove('active'));
    return;
  }

  activeCveId = cveId;
  document.querySelectorAll('.ap-cve').forEach(el => {
    el.classList.toggle('active', el.dataset.cve === cveId);
  });

  // Find this CVE's paths and build node/edge sets for highlighting
  const ap = ATTACK_PATHS.find(a => a.cve_id === cveId);
  if (!ap || !ap.paths.length) return;

  const pathNodes = new Set();
  const pathEdges = new Set();

  ap.paths.forEach(p => {
    const nodes = p.path;
    // Map display names back to graph node IDs
    nodes.forEach(name => {
      // Try exact id matches first, then label match
      const byId = ['fn:'+name, 'function:'+name, 'lib:'+name, 'file:'+name, 'cve:'+name];
      for (const id of byId) {
        if (GRAPH.nodes[id]) { pathNodes.add(id); break; }
      }
      // label match fallback
      Object.keys(GRAPH.nodes).forEach(id => {
        if (GRAPH.nodes[id].label === name) pathNodes.add(id);
      });
    });
    // Mark edges between consecutive path nodes
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i+1];
      // find actual node IDs
      const aId = Object.keys(GRAPH.nodes).find(id => GRAPH.nodes[id].label === a || id.endsWith(':'+a));
      const bId = Object.keys(GRAPH.nodes).find(id => GRAPH.nodes[id].label === b || id.endsWith(':'+b));
      if (aId && bId) pathEdges.add(`${aId}→${bId}`);
    }
  });

  precomputedAttackPath = { pathNodes, pathEdges };
  attackPath = precomputedAttackPath;

  // Update banner with shortest path
  const shortest = ap.paths.reduce((a,b) => a.depth <= b.depth ? a : b);
  pathBanner.style.display = 'block';
  pathBanner.textContent = '⚠ ATTACK PATH: ' + shortest.path.join(' → ');
}

// Panel toggle button
document.getElementById('btn-attack-paths').addEventListener('click', () => {
  const panel = document.getElementById('attack-panel');
  const btn   = document.getElementById('btn-attack-paths');
  const open  = panel.classList.toggle('open');
  btn.classList.toggle('active', open);
});
document.getElementById('ap-close').addEventListener('click', () => {
  document.getElementById('attack-panel').classList.remove('open');
  document.getElementById('btn-attack-paths').classList.remove('active');
});

};

</script>
