<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAGE — Palette Options</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0f0f0f; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

const palettes = [
  {
    id: "current",
    label: "01 · Current",
    bg: "#09090f",
    bg2: "#0f0f1a",
    border: "rgba(255,255,255,.08)",
    primary: "#8b5cf6",
    primaryLight: "#a78bfa",
    secondary: "#2dd4bf",
    scan: "#fb923c",
    success: "#4ade80",
    info: "#60a5fa",
    text: "#f1f5f9",
    muted: "#94a3b8",
    heroGrad: "linear-gradient(135deg,#8b5cf6 0%,#60a5fa 40%,#2dd4bf 100%)",
    tag: "5 hues · status quo",
  },
  {
    id: "violet-cyan",
    label: "02 · Violet + Cyan",
    bg: "#08080e",
    bg2: "#0e0e1c",
    border: "rgba(255,255,255,.07)",
    primary: "#7c3aed",
    primaryLight: "#a78bfa",
    secondary: "#06b6d4",
    scan: "#f59e0b",
    success: "#34d399",
    info: "#06b6d4",
    text: "#f8fafc",
    muted: "#94a3b8",
    heroGrad: "linear-gradient(135deg,#7c3aed 0%,#a855f7 40%,#06b6d4 100%)",
    tag: "4 hues · tighter",
  },
  {
    id: "hacker",
    label: "03 · Hacker Terminal",
    bg: "#050a05",
    bg2: "#0a120a",
    border: "rgba(0,220,130,.08)",
    primary: "#00dc82",
    primaryLight: "#34d399",
    secondary: "#a855f7",
    scan: "#facc15",
    success: "#00dc82",
    info: "#a855f7",
    text: "#ecfdf5",
    muted: "#6b7280",
    heroGrad: "linear-gradient(135deg,#00dc82 0%,#06b6d4 50%,#a855f7 100%)",
    tag: "Matrix green · bold",
  },
  {
    id: "crimson",
    label: "04 · Crimson Intel",
    bg: "#0c0608",
    bg2: "#130a0c",
    border: "rgba(244,63,94,.07)",
    primary: "#f43f5e",
    primaryLight: "#fb7185",
    secondary: "#2dd4bf",
    scan: "#f59e0b",
    success: "#4ade80",
    info: "#c084fc",
    text: "#fff1f2",
    muted: "#9ca3af",
    heroGrad: "linear-gradient(135deg,#f43f5e 0%,#c084fc 50%,#2dd4bf 100%)",
    tag: "Red primary · aggressive",
  },
  {
    id: "ocean",
    label: "05 · Deep Ocean",
    bg: "#050912",
    bg2: "#0a1020",
    border: "rgba(59,130,246,.08)",
    primary: "#3b82f6",
    primaryLight: "#60a5fa",
    secondary: "#06b6d4",
    scan: "#a855f7",
    success: "#34d399",
    info: "#38bdf8",
    text: "#f0f9ff",
    muted: "#94a3b8",
    heroGrad: "linear-gradient(135deg,#3b82f6 0%,#06b6d4 50%,#34d399 100%)",
    tag: "Blue primary · enterprise",
  },
  {
    id: "amber",
    label: "06 · Amber & Violet",
    bg: "#0a0806",
    bg2: "#12100a",
    border: "rgba(251,191,36,.06)",
    primary: "#8b5cf6",
    primaryLight: "#c4b5fd",
    secondary: "#f59e0b",
    scan: "#fb923c",
    success: "#2dd4bf",
    info: "#f59e0b",
    text: "#fef9f0",
    muted: "#a8a29e",
    heroGrad: "linear-gradient(135deg,#8b5cf6 0%,#c084fc 40%,#f59e0b 100%)",
    tag: "Purple + gold · premium",
  },
];

function PaletteCard({ p }) {
  const mono = "'JetBrains Mono', monospace";
  const sans = "'Inter', sans-serif";

  const cardStyle = {
    background: p.bg,
    width: '100%',
    height: '100%',
    padding: '24px',
    display: 'flex',
    flexDirection: 'column',
    gap: '16px',
    fontFamily: sans,
  };

  // Hero strip
  const heroStyle = {
    background: p.bg2,
    border: `1px solid ${p.border}`,
    borderRadius: '10px',
    padding: '18px 20px',
    position: 'relative',
    overflow: 'hidden',
  };
  const heroGlowStyle = {
    position: 'absolute', top: '-20px', right: '-20px',
    width: '120px', height: '120px',
    background: `radial-gradient(ellipse, ${p.primary}22 0%, transparent 70%)`,
    pointerEvents: 'none',
  };
  const heroTitle = {
    fontFamily: sans,
    fontSize: '28px',
    fontWeight: 900,
    letterSpacing: '-1px',
    background: p.heroGrad,
    WebkitBackgroundClip: 'text',
    WebkitTextFillColor: 'transparent',
    backgroundClip: 'text',
    lineHeight: 1,
    marginBottom: '6px',
  };
  const heroSub = {
    fontFamily: mono,
    fontSize: '10px',
    color: p.secondary,
    letterSpacing: '1px',
  };

  // Stats row
  const statsRow = {
    display: 'flex',
    gap: '8px',
  };
  const stat = (val, label, color) => (
    <div style={{
      flex: 1, background: p.bg2, border: `1px solid ${p.border}`,
      borderRadius: '8px', padding: '10px', textAlign: 'center',
    }}>
      <div style={{ fontFamily: mono, fontSize: '18px', fontWeight: 700, color, lineHeight: 1 }}>{val}</div>
      <div style={{ fontFamily: mono, fontSize: '8px', color: p.muted, marginTop: '4px', letterSpacing: '0.5px' }}>{label}</div>
    </div>
  );

  // Arch nodes
  const archRow = {
    display: 'flex',
    alignItems: 'center',
    gap: '6px',
  };
  const node = (label, sub, color) => (
    <div style={{
      flex: 1, background: `${color}12`, border: `1.5px solid ${color}44`,
      borderRadius: '8px', padding: '10px 8px', textAlign: 'center',
    }}>
      <div style={{ fontFamily: mono, fontSize: '9px', fontWeight: 700, color, lineHeight: 1.3 }}>{label}</div>
      {sub && <div style={{ fontFamily: mono, fontSize: '7.5px', color: `${color}66`, marginTop: '4px' }}>{sub}</div>}
    </div>
  );
  const arrow = (color) => (
    <div style={{ color: color, fontSize: '12px', flexShrink: 0, opacity: 0.6 }}>→</div>
  );

  // CTA button
  const ctaStyle = {
    display: 'flex',
    gap: '8px',
    alignItems: 'center',
  };
  const btn = (label, style) => (
    <div style={{
      flex: 1, padding: '9px 12px', borderRadius: '7px',
      fontFamily: sans, fontSize: '11px', fontWeight: 600,
      textAlign: 'center', cursor: 'pointer', ...style,
    }}>{label}</div>
  );

  // Swatches
  const swatchRow = {
    display: 'flex',
    gap: '6px',
    alignItems: 'center',
    flexWrap: 'wrap',
  };
  const swatch = (color, label) => (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '3px' }}>
      <div style={{ width: '28px', height: '28px', borderRadius: '6px', background: color, border: '1px solid rgba(255,255,255,.1)' }}></div>
      <div style={{ fontFamily: mono, fontSize: '6.5px', color: p.muted, letterSpacing: '0.3px' }}>{label}</div>
    </div>
  );

  // Tag badge
  const tagStyle = {
    display: 'inline-block',
    fontFamily: mono,
    fontSize: '8px',
    color: p.secondary,
    background: `${p.secondary}14`,
    border: `1px solid ${p.secondary}30`,
    borderRadius: '4px',
    padding: '2px 7px',
    letterSpacing: '0.5px',
    marginTop: '4px',
  };

  return (
    <div style={cardStyle}>
      {/* Hero */}
      <div style={heroStyle}>
        <div style={heroGlowStyle}></div>
        <div style={heroTitle}>SAGE</div>
        <div style={heroSub}>sage --scan ./your-repo --auto-pr</div>
        <div style={tagStyle}>{p.tag}</div>
      </div>

      {/* Stats */}
      <div style={statsRow}>
        {stat('12', 'STAGES', p.primary)}
        {stat('45', 'CWEs', p.scan)}
        {stat('30', 'PACKS', p.secondary)}
        {stat('1', 'CMD', p.success)}
      </div>

      {/* Architecture nodes */}
      <div style={archRow}>
        {node('Synapse\nGraph', 'tree-sitter', p.secondary)}
        {arrow(p.muted)}
        {node('Claude\nAnalyzer', 'Opus 4', p.primary)}
        {arrow(p.secondary)}
        {node('GitHub\nPR', '✓ merged', p.info)}
      </div>

      {/* CTA buttons */}
      <div style={ctaStyle}>
        {btn('★ Star on GitHub', {
          background: `${p.primary}18`,
          border: `1.5px solid ${p.primary}50`,
          color: p.primaryLight,
        })}
        {btn('Quick Start →', {
          background: p.primary,
          border: `1.5px solid ${p.primary}`,
          color: '#fff',
        })}
      </div>

      {/* Swatches */}
      <div style={{ background: p.bg2, border: `1px solid ${p.border}`, borderRadius: '8px', padding: '12px' }}>
        <div style={{ fontFamily: mono, fontSize: '7.5px', color: p.muted, marginBottom: '8px', letterSpacing: '1px' }}>COLOR SYSTEM</div>
        <div style={swatchRow}>
          {swatch(p.primary, 'primary')}
          {swatch(p.secondary, 'secondary')}
          {swatch(p.scan, 'scan')}
          {swatch(p.success, 'success')}
          {swatch(p.info, 'info')}
          {swatch(p.bg2, 'bg')}
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="palettes" title="SAGE — Color Palette Options" subtitle="Pick your favourite — click any card to focus fullscreen">
        {palettes.map(p => (
          <DCArtboard key={p.id} id={p.id} label={p.label} width={320} height={520}>
            <PaletteCard p={p} />
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
