name: SAGE — Security Scan

on:
  # Run weekly on Monday 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'
  # Run on every push to main/master (catches new deps immediately)
  push:
    branches: [main, master]
    paths:
      - 'requirements*.txt'
      - 'package*.json'
      - 'Pipfile'
      - 'pyproject.toml'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of CVE history to fetch (default: 7)'
        required: false
        default: '7'

jobs:
  sage-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push security-patch branch
      pull-requests: write # create PR

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git push works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install SAGE dependencies
        run: |
          # Install SAGE itself (not the scanned repo's deps).
          # Single source of truth: requirements.txt (pinned versions).
          # Do NOT hand-list packages here — that drifts from requirements.txt
          # and previously installed the DEPRECATED google-generativeai and an
          # unpinned set. requirements.txt pins google-genai (the current SDK).
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "SAGE Security Bot"
          git config user.email "sage-bot@users.noreply.github.com"

      - name: Run SAGE digest
        env:
          NVD_API_KEY:      ${{ secrets.NVD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          # Tell SAGE which repo to raise PRs against (owner/repo format)
          GITHUB_REPO:      ${{ github.repository }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          python main.py --digest "${{ github.workspace }}" --days "$DAYS"

      - name: Upload Synapse graph artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-graph-${{ github.run_number }}
          path: |
            data/synapse_graph.json
            data/reachability.json
            data/confirmed.json
            data/pr_result.json
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## SAGE Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/pr_result.json ]; then
            PR_URL=$(python3 -c "import json; d=json.load(open('data/pr_result.json')); print(d.get('pr_url',''))" 2>/dev/null || echo "")
            if [ -n "$PR_URL" ]; then
              echo "### ✅ PR Raised" >> $GITHUB_STEP_SUMMARY
              echo "[$PR_URL]($PR_URL)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ -f data/confirmed.json ]; then
            COUNT=$(python3 -c "import json; print(len(json.load(open('data/confirmed.json'))))" 2>/dev/null || echo "0")
            echo "**Confirmed exploitable CVEs:** $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/reachability.json ]; then
            REACH=$(python3 -c "import json; d=json.load(open('data/reachability.json')); print(sum(1 for r in d if r.get('reachable')))" 2>/dev/null || echo "0")
            echo "**Reachable CVEs:** $REACH" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Generated by [SAGE](https://github.com/anubhavmohandas/SAGE)_" >> $GITHUB_STEP_SUMMARY
